}.positive{color:var(--green)}.negative{color:var(--red)}.auctionstage{background:#171717;border:1px solid #59461f;border-radius:10px;padding:20px;text-align:center}.auctionstage .hero{width:min(760px,100%);height:320px;object-fit:cover;border-radius:8px}.lotno{color:var(--gold);letter-spacing:3px;font-size:13px}.auctioneer{font-size:20px;min-height:60px;display:flex;align-items:center;justify-content:center}.bid{font-size:46px;font-weight:800;color:var(--gold);margin:12px}.bidlog{height:180px;overflow:auto;background:#0d0d0d;border:1px solid #333;padding:10px;text-align:left;max-width:800px;margin:15px auto}.bidlog p{margin:5px 0}.you{color:#e4bd68}.ai{color:#aaa}.timer{font-size:13px;color:#888}.week{font-size:13px;color:#aaa}.bar{height:8px;background:#444;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{padding:10px;border-bottom:1px solid #3a3a3a;text-align:left}th{color:var(--gold)}footer{text-align:center;color:#666;padding:30px}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.auctionstage .hero{height:230px}}

{id:7,make:'Ford',model:'Capri 2.8 Injection',year:1985,guide:[14000,19000],condition:69,pop:94,base:16500,repair:12500,style:'Performance',photo:'capri',remarks:['Oh, I know these. Brilliant cars.','A Capri 2.8 will always find a following.']},

{id:13,make:'Jaguar',model:'E-Type Series 1',year:1966,guide:[55000,70000],condition:64,pop:98,base:62000,repair:32000,style:'Blue-chip classic',photo:'eType',remarks:['Brilliant car. I’ve driven an E-Type myself — you never forget it.','One of the great British shapes.']},

{id:16,make:'Ford',model:'Escort RS2000 Mk1',year:1974,guide:[22000,30000],condition:71,pop:97,base:26000,repair:18000,style:'Performance',photo:'rs2000',remarks:['RS2000 — that will get the room awake.','Very desirable old Ford.']},
{id:17,make:'MG',model:'Midget 1500',year:1979,guide:[4500,6500],condition:70,pop:75,base:5400,repair:5600,style:'British sports',photo:'midget',remarks:['Tiny, simple, and enormous fun.','A weekend toy if ever there was one.']},
{id:18,make:'Lotus',model:'Elan S4',year:1972,guide:[28000,38000],condition:60,pop:89,base:33000,repair:24000,style:'Lightweight sports',photo:'elan',remarks:['Very light, very quick, very Lotus.','A proper driver’s car.']},
{id:19,make:'Volvo',model:'P1800',year:1967,guide:[18000,26000],condition:76,pop:82,base:22000,repair:9000,style:'Cult classic',photo:'volvo',remarks:['A lovely P1800. And yes, it really is that handsome.','Great old touring car.']},
{id:20,make:'BMW',model:'325i E30',year:1989,guide:[9000,14000],condition:73,pop:93,base:11500,repair:8500,style:'Performance',photo:'bmw',remarks:['E30s are getting harder to buy well.','Six-cylinder BMW — very popular tonight.']},
{id:21,make:'Mercedes-Benz',model:'230E W123',year:1984,guide:[6500,9500],condition:80,pop:78,base:8000,repair:6500,style:'Luxury saloon',photo:'merc',remarks:['Built like a bank vault.','Very sensible classic Mercedes.']},
{id:22,make:'Ford',model:'Sierra RS Cosworth',year:1987,guide:[42000,60000],condition:68,pop:99,base:50000,repair:26000,style:'Performance',photo:'sierra',remarks:['Now then — that is an RS Cosworth.','This could be the star of the sale.']},
{id:23,make:'Austin',model:'Metro Vanden Plas',year:1985,guide:[1800,3000],condition:62,pop:58,base:2400,repair:4300,style:'Small classic',photo:'metro',remarks:['Very few people expected these to become collectible.','A charming little survivor.']}
];
const projects=[
{id:101,make:'Jaguar',model:'XJ6 Series I Barn Find',year:1972,guide:[1800,3500],condition:15,pop:81,base:2600,repair:42000,style:'Full restoration',photo:'xj',project:true,rareChance:.035,remarks:['This is a proper project. Do not underestimate it.']},
{id:102,make:'Ford',model:'Cortina 1600E Shell',year:1970,guide:[2500,5000],condition:12,pop:94,base:3600,repair:48000,style:'Full restoration',photo:'cortina',project:true,rareChance:.025,remarks:['Very rough. But if the shell is right, this could be special.']},
{id:103,make:'Triumph',model:'TR6 Restoration Project',year:1971,guide:[1800,4500],condition:20,pop:86,base:3200,repair:33000,style:'Full restoration',photo:'tr6',project:true,rareChance:.04,remarks:['You’ll need a brave wallet for this one.']},
{id:104,make:'Ford',model:'Escort RS2000 Project',year:1974,guide:[6000,10000],condition:10,pop:99,base:8000,repair:65000,style:'Full restoration',photo:'rs2000',project:true,rareChance:.02,remarks:['If that really is an RS shell, this could be a monster.']},
{id:105,make:'Land Rover',model:'Series III Field Find',year:1977,guide:[1800,3500],condition:25,pop:84,base:2400,repair:30000,style:'Full restoration',photo:'land',project:true,rareChance:.05,remarks:['Looks agricultural. That is probably a compliment.']}
];
const moods=[
{name:'Cold Room',desc:'Bidders are cautious. Lots are struggling to make guide.',mult:.84,styles:{}},
{name:'British Revival',desc:'British sports cars and old Fords are flying tonight.',mult:1.03,styles:{'British sports':1.2,'British saloon':1.12,'Performance':1.1}},
{name:'Fast Ford Fever',desc:'The room has gone mad for quick Fords.',mult:1.04,styles:{Performance:1.28,'Hot hatch':1.18}},
{name:'Collectors’ Evening',desc:'Collectors are paying hard money for strong examples.',mult:1.09,styles:{'Blue-chip classic':1.25,'Cult classic':1.12,'Lightweight sports':1.18}},
{name:'Youngtimer Night',desc:'80s and 90s cars are attracting the younger crowd.',mult:1.04,styles:{Performance:1.17,'Hot hatch':1.25,'Small classic':1.1}},
{name:'Wild Auction',desc:'Nobody quite knows where the room will go.',mult:1,styles:{wild:1}}
];
const personalities=[
{name:'Colin',type:'collector',style:'calm',phrases:['I’ve wanted one of these for years.','That is exactly the sort I collect.']},
{name:'Dave',type:'dealer',style:'sharp',phrases:['There’s a margin in that.','I know what these make at retail.']},
{name:'Sarah',type:'enthusiast',style:'emotional',phrases:['That is lovely!','I’ve driven one myself — brilliant little cars.']},
{name:'Mike',type:'restorer',style:'practical',phrases:['Needs money, but I like it.','I can see the bones of a good car there.']},
{name:'Helen',type:'collector',style:'quiet',phrases:['I’ll have that.','That provenance is interesting.']},
{name:'Graham',type:'dealer',style:'aggressive',phrases:['I’m buying this one.','That’s still cheap.']},
{name:'Tom',type:'enthusiast',style:'young',phrases:['Come on!','That’s the one I came for.']},
{name:'Peter',type:'restorer',style:'veteran',phrases:['I’ve seen these go much higher.','That can be saved.']}
];
let state={cash:25000,day:1,week:1,screen:'home',auction:null,inventory:[],storage:[],restoring:[],unsold:[],reports:{},log:[],lotNumber:1,lastAuctionWeek:0,soldIds:[],consigned:[]};
function money(n){return '£'+Math.max(0,Math.round(n)).toLocaleString('en-GB')}
function save(){localStorage.setItem('northshire3',JSON.stringify(state))}
function load(){try{const x=JSON.parse(localStorage.getItem('northshire3'));if(x)state={...state,...x}}catch(e){}state.soldIds=Array.isArray(state.soldIds)?state.soldIds:[];state.consigned=Array.isArray(state.consigned)?state.consigned:[];state.lastAuctionWeek=Number.isFinite(state.lastAuctionWeek)?state.lastAuctionWeek:0}
function allCars(){return [...cars,...projects]}
function car(id){return allCars().find(c=>c.id===id)}
function img(c){const url=c&&photos[c.photo];return url?`<img class="carimg" src="${url}" alt="${c.year} ${c.make} ${c.model}" loading="lazy" onerror="this.onerror=null;this.src='';this.nextElementSibling.style.display='flex'">`:`<div></div>`}
function image(c){return img(c)+`<div class="placeholder" style="display:none">🚗</div>`}
function report(c){const r=state.reports[c.id];if(!r)return '<p class="muted">No professional report. You are judging it by eye.</p>';if(r.level===1)return `<p><b>Basic report:</b> condition likely ${r.lo}-${r.hi}%. Repair budget likely ${money(r.rlo)}–${money(r.rhi)}. Popularity clue: ${r.popHint}.</p>`;return `<p><b>Full report:</b> overall ${r.condition}%. Body ${r.body}%, mechanical ${r.mechanical}%, provenance ${r.provenance}%. Estimated restoration/repair budget ${money(r.repair)}.</p><p class="muted">${r.faults.join(' • ')}</p>`}
function faults(c){if(c.condition>=82)return ['Minor age-related wear','No major faults found'];if(c.condition>=65)return ['Deferred maintenance visible','Check brakes, suspension and cooling system'];if(c.condition>=45)return ['Rust/corrosion risk','Mechanical recommissioning likely','Expect seals, hoses and brakes'];return ['Extensive corrosion risk','Major mechanical work likely','Electrical/interior work likely','Restoration required']}
function inspect(id,full){const c=car(id),cost=full?750:200;if(!c||state.cash<cost)return alert(!c?'Car not found.':'Not enough cash.');state.cash-=cost;if(full)state.reports[id]={level:2,condition:c.condition,body:Math.max(10,c.condition+rand(-6,6)),mechanical:Math.max(10,c.condition+rand(-10,7)),provenance:Math.round(45+c.pop*.45),repair:c.repair,faults:faults(c)};else state.reports[id]={level:1,lo:Math.max(5,c.condition-10),hi:Math.min(100,c.condition+10),rlo:Math.round(c.repair*.72),rhi:Math.round(c.repair*1.3),popHint:c.pop>90?'exceptionally strong following':c.pop>78?'strong enthusiast following':c.pop>68?'established following':'niche/cult following'};state.log.unshift(`${full?'Full':'Basic'} condition report on ${c.year} ${c.make} ${c.model}: ${money(cost)}.`);save();render()}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function market(c){const a=state.auction||{},m=a.mood||moods[0],style=m.styles[c.style]||1,cond=.48+c.condition/100*.52,drift=1+Math.sin((state.day+c.id)*.73)*.07,rest=c.restored?1.2:1,rare=c.rare?1.65:1;return Math.max(250,Math.round(c.base*m.mult*style*cond*drift*rest*rare))}
function weeklyAuction(){
 if(state.day%7!==0){alert(`The next auction is on Day ${7-(state.day%7)} from now. Auctions run once per in-game week.`);return}
 if(state.lastAuctionWeek===state.week){alert('This week’s auction has already been held. Advance the days to next week.');return}
 state.lastAuctionWeek=state.week;
 const returned=state.unsold.splice(0).map(c=>({kind:'buy',car:c}));
 const consignments=state.consigned.splice(0).map(c=>({kind:'sell',car:c}));
 const unavailable=new Set([...state.soldIds,...state.inventory.map(x=>x.id),...state.storage.map(x=>x.id),...state.restoring.map(x=>x.id),...returned.map(x=>x.car.id),...consignments.map(x=>x.car.id)]);
 const fresh=allCars().filter(c=>!unavailable.has(c.id)).sort(()=>Math.random()-.5);
 let pool=[...consignments,...returned,...fresh.slice(0,Math.max(0,12-consignments.length-returned.length)).map(c=>({kind:'buy',car:c}))];
 state.auction={kind:'buy',mood:moods[rand(0,moods.length-1)],queue:pool,index:0,phase:'wait',count:4,current:null,opening:0,highest:0,highestBidder:null,bidders:[],bidLog:[],playerDropped:false,goingCount:0};
 state.screen='auction';save();render();waitLot()
}
function waitLot(){const a=state.auction;if(!a)return;a.phase='wait';a.count=rand(3,6);a.current=null;a.bidLog=[];render();clearInterval(a.timer);a.timer=setInterval(()=>{a.count--;if(a.count<=0){clearInterval(a.timer);showLot()}render()},1000)}
function opening(c){return Math.max(250,Math.round(c.guide[0]*.65/250)*250)}
function bidStep(v){return v<5000?250:v<15000?500:v<30000?1000:v<60000?2500:5000}
function makeBidders(c){return personalities.map((p,i)=>{let max=c.base*(.55+c.pop/100*.85)*((state.auction.mood.styles[c.style]||1)*state.auction.mood.mult);if(p.type==='collector')max*=c.pop/100;if(p.type==='enthusiast'&&['British sports','Performance','Hot hatch'].includes(c.style))max*=1.12;if(p.type==='restorer'&&c.condition<50)max*=1.16;if(p.type==='dealer')max*=.9;return {...p,max:Math.round(max/250)*250,active:true,id:i}}).sort(()=>Math.random()-.5)}
function showLot(){const a=state.auction;if(!a||a.index>=a.queue.length){endAuction();return}a.lot=a.queue[a.index];a.current=a.lot.car;a.sellerLot=a.lot.kind==='sell';a.phase='bidding';a.opening=opening(a.current);a.highest=0;a.highestBidder=null;a.bidders=makeBidders(a.current);a.bidLog=[`Auctioneer: “Lot ${state.lotNumber}. ${a.current.year} ${a.current.make} ${a.current.model}. Who’ll start me at ${money(a.opening)}?”`];a.playerDropped=false;render();setTimeout(aiBid,700)}
function remarkFor(b,c){const p=b.phrases;return p[rand(0,p.length-1)]}
function auctioneerCall(a){const c=a.current;const v=a.highest;if(a.highestBidder==='YOU')return rand(0,2)===0?`Auctioneer: “I’ve got you at ${money(v)}. Who’s going to beat it?”`:`Auctioneer: “Bid is with our bidder at ${money(v)}. Surely we’re not done?”`;if(!v)return `Auctioneer: “We’re looking for ${money(a.opening)} to start us.”`;if(v>c.guide[1])return `Auctioneer: “We are well over the top of the guide now — ${money(v)}!”`;if(v>=c.guide[0])return `Auctioneer: “At ${money(v)} now. Good bidding.”`;return `Auctioneer: “At ${money(v)}. Looking for the next bid.”`}
function aiBid(){
 const a=state.auction;if(!a||a.phase!=='bidding')return;
 const active=a.bidders.filter(b=>b.active);
 if(!active.some(b=>b.max>=(a.highest? a.highest+bidStep(a.highest):a.opening))){startGoing();return}
 const eligible=active.filter(b=>b.max>=(a.highest? a.highest+bidStep(a.highest):a.opening));
 if(!eligible.length){startGoing();return}
 const b=eligible[rand(0,eligible.length-1)];
 const offer=a.highest?a.highest+bidStep(a.highest):a.opening;
 a.highest=offer;a.highestBidder=b.name;
 a.bidLog.unshift(`${b.name}: “${remarkFor(b,a.current)}”`);a.bidLog.unshift(`${b.name} bids ${money(offer)}.`);
 render();setTimeout(aiBid,650+Math.random()*850)
}
function startGoing(){const a=state.auction;if(!a||a.phase!=='bidding')return;a.phase='going';a.goingCount=3;a.bidLog.unshift(a.highest?`Auctioneer: “Going once at ${money(a.highest)}...”`:'Auctioneer: “I need a bid or we’ll pass the lot.”');render();clearInterval(a.goingTimer);a.goingTimer=setInterval(()=>{if(!state.auction||state.auction!==a){clearInterval(a.goingTimer);return}a.goingCount--;if(a.goingCount===2)a.bidLog.unshift(a.highest?`Auctioneer: “Going twice at ${money(a.highest)}...”`:'Auctioneer: “Last chance...”');if(a.goingCount===1)a.bidLog.unshift(a.highest?`Auctioneer: “Last chance, ladies and gentlemen!”`:'Auctioneer: “No bid? We’ll pass it.”');if(a.goingCount<=0){clearInterval(a.goingTimer);sellLot()}render()},900)}
function playerBid(){const a=state.auction;if(!a||!['bidding','going'].includes(a.phase)||a.playerDropped)return;const offer=a.highest?a.highest+bidStep(a.highest):a.opening;if(offer>state.cash){alert('That bid exceeds your cash.');return}if(a.phase==='going'){clearInterval(a.goingTimer);a.phase='bidding';a.bidLog.unshift('Auctioneer: “We have a fresh bid! Back to bidding.”')}a.highest=offer;a.highestBidder='YOU';a.bidLog.unshift(`You bid ${money(offer)}.`);render();setTimeout(aiBid,500)}
function drop(){if(state.auction?.phase==='bidding'){state.auction.playerDropped=true;state.auction.bidLog.unshift('You stop bidding.');render()}}
function sellLot(){const a=state.auction,c=a.current;if(!a||!['bidding','going'].includes(a.phase))return;clearInterval(a.goingTimer);a.phase='result';const won=a.highestBidder==='YOU';if(a.sellerLot){if(a.highestBidder){state.cash+=a.highest;state.log.unshift(`Your ${c.year} ${c.make} ${c.model} sold for ${money(a.highest)} to ${a.highestBidder}.`)}else{state.consigned.push(c);state.log.unshift(`Your ${c.year} ${c.make} ${c.model} failed to sell and is available to consign again.`)}a.result={won:false,sold:!!a.highestBidder,price:a.highest,buyer:a.highestBidder||'No sale'}}else if(won){state.cash-=a.highest;state.inventory.push({...c,purchase:a.highest,restored:false,repairSpent:0,source:'auction'});a.result={won:true,sold:true,price:a.highest,buyer:'YOU'}}else if(a.highestBidder){state.soldIds.push(c.id);state.log.unshift(`${c.year} ${c.make} ${c.model} has left the auction house.`);a.result={won:false,sold:true,price:a.highest,buyer:a.highestBidder}}else{state.unsold.push(c);a.result={won:false,sold:false,price:0,buyer:'No sale'}}state.log.unshift(`${a.sellerLot?'Consignment':'Lot'} ${c.year} ${c.make} ${c.model} ${a.result.sold?'sold':'passed'} at ${a.result.price?money(a.result.price):'no bid'}.`);render();setTimeout(()=>{state.lotNumber++;a.index++;if(a.index>=a.queue.length)endAuction();else waitLot()},3500)}
function endAuction(){if(state.auction?.timer)clearInterval(state.auction.timer);state.auction=null;state.log.unshift(`Week ${state.week} auction finished. ${state.unsold.length} lots carried to next week.`);save();render()}
function advanceDay(){state.day++;if(state.day%7===1)state.week++;let fee=state.storage.length*75;state.cash-=fee;state.restoring.forEach(c=>c.daysLeft--);const done=state.restoring.filter(c=>c.daysLeft<=0);state.restoring=state.restoring.filter(c=>c.daysLeft>0);done.forEach(c=>{c.restored=true;c.condition=99; if(Math.random()<c.rareChance){c.rare=true;c.pop=Math.min(100,c.pop+8);c.base*=2.4;state.log.unshift(`RESTORATION DISCOVERY: ${c.year} ${c.make} ${c.model} proved exceptionally valuable.`)}state.inventory.push(c);state.log.unshift(`Restoration completed: ${c.year} ${c.make} ${c.model}.`)});state.log.unshift(`Day ${state.day}. Storage fees: ${money(fee)}.`);save();render()}
function startRestore(i){const c=state.inventory[i];if(!c)return;const full=c.project||c.condition<35;const cost=Math.round(c.repair*(full?1.05:.78));const days=full?rand(18,32):rand(6,12);if(state.cash<cost)return alert(`You need ${money(cost)} for this restoration.`);state.cash-=cost;state.inventory.splice(i,1);state.restoring.push({...c,restoreCost:cost,daysLeft:days,totalDays:days});state.log.unshift(`Restoration started on ${c.year} ${c.make} ${c.model}: ${money(cost)}, ${days} days.`);save();render()}
function store(i){const c=state.inventory[i];state.storage.push(c);state.inventory.splice(i,1);state.log.unshift(`Stored ${c.year} ${c.make} ${c.model}.`);save();render()}
function retrieve(i){state.inventory.push(state.storage[i]);state.storage.splice(i,1);state.log.unshift('Car retrieved from storage.');save();render()}
function sellCar(i,stored=false){const arr=stored?state.storage:state.inventory;if(!arr[i])return;state.auction={kind:'sell',mood:moods[rand(0,moods.length-1)],current:{...arr[i]},phase:'sellerWait',count:4,bidders:[],highest:0,highestBidder:null,bidLog:[],arrType:stored?'storage':'inventory',index:i};state.screen='sell';render();state.auction.timer=setInterval(()=>{state.auction.count--;if(state.auction.count<=0){clearInterval(state.auction.timer);startSale()}render()},1000)}
function startSale(){const a=state.auction;a.phase='sellerBidding';a.bidders=makeBidders(a.current);a.highest=opening(a.current);a.bidLog=[`Auctioneer: “This is a car from a private collection. Listen to this...”`];render();setTimeout(aiSell,700)}
function aiSell(){const a=state.auction;if(!a||a.phase!=='sellerBidding')return;const active=a.bidders.filter(b=>b.active&&b.max>a.highest);if(!active.length){finishSale();return}const b=active[rand(0,active.length-1)],offer=a.highest+bidStep(a.highest);if(offer<=b.max){a.highest=offer;a.highestBidder=b.name;a.bidLog.unshift(`${b.name}: “${remarkFor(b,a.current)}”`);a.bidLog.unshift(`${b.name} bids ${money(offer)}.`)}else b.active=false;render();setTimeout(aiSell,700+Math.random()*900)}
function finishSale(){const a=state.auction;if(!a)return;a.phase='result';const arr=a.arrType==='storage'?state.storage:state.inventory;const c=arr[a.index];const sold=!!a.highestBidder;if(sold){state.cash+=a.highest;arr.splice(a.index,1);state.log.unshift(`Your ${c.year} ${c.make} ${c.model} sold for ${money(a.highest)} to ${a.highestBidder}.`)}else state.log.unshift(`Your ${c.year} ${c.make} ${c.model} failed to sell.`);a.result={sold,price:a.highest,buyer:a.highestBidder||'No sale'};render();setTimeout(()=>{state.auction=null;state.screen='garage';save();render()},3500)}
function consignCar(i){const c=state.inventory[i];if(!c)return;state.inventory.splice(i,1);state.consigned.push(c);state.log.unshift(`Consigned ${c.year} ${c.make} ${c.model} to the next weekly auction.`);save();render()}
function consignStored(i){const c=state.storage[i];if(!c)return;state.storage.splice(i,1);state.consigned.push(c);state.log.unshift(`Consigned ${c.year} ${c.make} ${c.model} from storage to the next weekly auction.`);save();render()}
function card(c){return `<div class="card">${image(c)}<div class="cardbody"><h3>${c.year} ${c.make} ${c.model}</h3><span class="tag">${c.style}</span>${c.project?'<span class="tag">FULL PROJECT</span>':''}<p>Guide: ${money(c.guide[0])}–${money(c.guide[1])}</p><p class="muted">${c.project?'Extremely rough. Restoration is expensive and slow; a rare discovery can transform the value.':'Viewing impression: '+(c.condition>80?'very presentable':c.condition>60?'used but promising':'rough — inspect carefully')+'.'}</p>${report(c)}<button onclick="inspect(${c.id},false)">Basic report £200</button><button onclick="inspect(${c.id},true)">Full report £750</button></div></div>`}
function home(){const days=7-(state.day%7)||7;return `<div class="notice"><h2>Week ${state.week} • Day ${state.day}</h2><p>Auctions run <b>once a week</b>, on Day 7. Each sale has a fresh set of cars plus every lot that failed to sell last week.</p>${state.day%7===0?'<button onclick="weeklyAuction()">Enter weekly auction</button>':'<button onclick="advanceDay()">Advance one day</button>'} <button class="secondary" onclick="state.screen='catalogue';render()">View catalogue</button><p class="week">Next auction: ${days} day${days===1?'':'s'}.</p></div><h2>Viewing Yard</h2><div class="grid">${cars.slice(0,12).map(card).join('')}</div><h2 style="margin-top:28px">Restoration Projects</h2><div class="grid">${projects.map(card).join('')}</div>`}
function catalogue(){return `<div class="notice"><h2>Full Catalogue</h2><p>All cars use model-matched photographs. The images are reference photographs, not the exact auction car, so condition in the game can differ.</p></div><div class="grid">${cars.map(card).join('')}</div>`}
function auction(){const a=state.auction;if(!a)return `<div class="notice"><h2>No auction running</h2><p>Weekly auctions are only held on Day 7.</p></div>`;if(a.phase==='wait')return `<div class="auctionstage"><div class="lotno">NEXT LOT</div><h2>The auctioneer is bringing the next car into the room...</h2><div class="bid">${a.count}</div><p>${a.index+1} of ${a.queue.length} lots • ${a.mood.name}</p><p class="muted">${a.mood.desc}</p></div>`;if(a.phase==='result')return `<div class="auctionstage">${image(a.current)}<h2>${a.sellerLot?(a.result.sold?'YOUR CAR SOLD':'NO SALE'):(a.result.won?'YOU BOUGHT IT':a.result.sold?'LOT SOLD':'NO SALE')}</h2><div class="bid">${a.result.price?money(a.result.price):'—'}</div><p>${a.sellerLot?(a.result.sold?`Sold to ${a.result.buyer}.`:'The car will be available to consign again.'):a.result.won?'The car is now in your garage.':a.result.sold?`Sold to ${a.result.buyer}.`:'The lot was passed and will return next week.'}</p></div>`;const c=a.current;return `<div class="auctionstage">${image(c)}<div class="lotno">${a.sellerLot?'YOUR CONSIGNED CAR • LOT':'LOT'} ${state.lotNumber}</div><h2>${c.year} ${c.make} ${c.model}</h2><p>Guide ${money(c.guide[0])}–${money(c.guide[1])} • ${a.mood.name}</p><div class="auctioneer">${a.sellerLot?`Auctioneer: “This one has come in from a private collector. Lovely car — let's see where the room takes it.”`:auctioneerCall(a)}</div><div class="bid">${a.highest?money(a.highest):money(a.opening)+' opening'}</div><div class="bidlog">${a.bidLog.map(x=>`<p class="${x.startsWith('You')?'you':'ai'}">${x}</p>`).join('')}</div><button ${a.playerDropped?'disabled':''} onclick="playerBid()">Bid ${money(a.highest?a.highest+bidStep(a.highest):a.opening)}</button><button class="secondary" onclick="drop()">I am out</button><p class="timer">Computer bidders act automatically. The auction continues even if you stop bidding.</p></div>`}

const existingKeys=new Set(cars.map(c=>c.make+'|'+c.model));
V4_CATALOG.forEach(c=>{if(!existingKeys.has(c.make+'|'+c.model)) cars.push(c)});

const PHOTO_FALLBACK={mini:photos.mini,cortina:photos.cortina,mgb:photos.mgb,spit:photos.spit,xj:photos.xj,p944:photos.p944,capri:photos.capri,sd1:photos.sd1,land:photos.land,beta:photos.beta,mr2:photos.mr2,astra:photos.astra,eType:photos.eType,tr6:photos.tr6,dolomite:photos.dolomite,rs2000:photos.rs2000,midget:photos.midget,elan:photos.elan,volvo:photos.volvo,bmw:photos.bmw,merc:photos.merc,sierra:photos.sierra,metro:photos.metro};

function v4Money(n){return money(n)}
function v4CloneLot(c,forced=null){const x={...c}; x.condition=forced==null?rand(28,96):forced; x.instanceId=c.id+'-'+state.week+'-'+rand(1000,9999); x.reserve=Math.round((c.guide[0]*(.62+rand(0,22)/100))/250)*250; x.flagged=state.flags?.includes(c.id); x.restoredSource=!!c.restoredSource; return x}
state.flags=Array.isArray(state.flags)?state.flags:[]; state.nextAuctionLots=Array.isArray(state.nextAuctionLots)?state.nextAuctionLots:[]; state.notifications=Array.isArray(state.notifications)?state.notifications:[];

/* Generate the next-auction yard once per week; the yard and catalogue now read the same queue. */
function v4GenerateNextLots(){
 const reservedIds=new Set([...(state.inventory||[]).map(x=>x.id),...(state.storage||[]).map(x=>x.id),...(state.restoring||[]).map(x=>x.id),...(state.consigned||[]).map(x=>x.id)]);
 const carry=(state.unsold||[]).map(x=>typeof x==='object'?x:car(x)).filter(Boolean).map(x=>v4CloneLot(x,x.condition));
 const cons=(state.consigned||[]).map(x=>v4CloneLot(x,x.condition));
 const unavailable=new Set([...reservedIds,...carry.map(x=>x.id),...cons.map(x=>x.id)]);
 const fresh=cars.filter(c=>!unavailable.has(c.id)).sort(()=>Math.random()-.5).slice(0,Math.max(0,12-carry.length-cons.length)).map(c=>v4CloneLot(c));
 state.nextAuctionLots=[...cons,...carry,...fresh];
 state.log.unshift('Next auction catalogue prepared: '+state.nextAuctionLots.length+' lots in the Viewing Yard.');
}
if(!state.nextAuctionLots.length) v4GenerateNextLots();

function v4Flag(id){state.flags=state.flags||[]; if(state.flags.includes(id)) state.flags=state.flags.filter(x=>x!==id); else state.flags.push(id); save(); render();}
window.flagCar=v4Flag;

function v4Photo(c){const key=modelPhoto[c.make+'|'+c.model]; if(key&&PHOTO_FALLBACK[key]) return '<img class="carimg" src="'+PHOTO_FALLBACK[key]+'" alt="'+c.year+' '+c.make+' '+c.model+'" loading="lazy"><div class="placeholder" style="display:none">🚗</div>'; return '<div class="placeholder">'+(c.style==='Commercial classic'?'🚚':'🚗')+'</div>';}

function v4Card(c,scheduled=false){const flag=(state.flags||[]).includes(c.id); const scheduledLots=(state.nextAuctionLots||[]).filter(x=>x.id===c.id); const restored=c.restored||c.restoredSource; return '<div class="card '+(flag?'flagged':'')+'">'+v4Photo(c)+'<div class="cardbody"><h3>'+c.year+' '+c.make+' '+c.model+'</h3><span class="tag">'+c.style+'</span>'+(c.project?'<span class="tag">FULL PROJECT</span>':'')+(restored?'<span class="tag positive">RESTORED</span>':'')+(flag?'<span class="tag">★ FLAGGED</span>':'')+(scheduledLots.length?'<span class="tag">NEXT AUCTION</span>':'')+'<p>Guide: '+money(c.guide[0])+'–'+money(c.guide[1])+(scheduledLots.length?' • Reserve '+money(scheduledLots[0].reserve):'')+'</p><p class="muted">Condition varies by auction instance. This catalogue entry is the model; the Viewing Yard shows the exact next-sale instance.</p><button onclick="inspect('+c.id+',false)">Basic report £200</button><button onclick="inspect('+c.id+',true)">Full report £750</button><button class="secondary" onclick="flagCar('+c.id+')">'+(flag?'Unflag':'Flag to bid')+'</button></div></div>'}

window.showNextListings=function(){const a=state.auction;if(!a)return;const next=a.queue.slice(a.index+1,a.index+6);const d=document.createElement('div');d.style='position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9999';d.innerHTML='<div style="background:#202020;color:#fff;max-width:720px;width:92%;padding:22px;border-radius:10px"><h2>Next listings</h2>'+ (next.length?next.map((c,i)=>'<p><b>Lot '+(state.lotNumber+i+1)+' — '+c.year+' '+c.make+' '+c.model+'</b><br><span class="muted">Guide '+money(c.guide[0])+'–'+money(c.guide[1])+' • Reserve '+money(c.reserve)+'</span></p>').join(''):'<p>No more listings this week.</p>') +'<button onclick="this.parentNode.parentNode.remove()">Close</button></div>';document.body.appendChild(d)};

// Advance-day: only prepare the next yard at the start of a new auction week.
const adv=window.advanceDay;window.advanceDay=function(){if(state.auction)return alert('Finish or leave the auction first.');const before=state.day;adv();if(state.day%7===1){prepareYard();state.notifications.unshift('NEW AUCTION: your Viewing Yard is ready for the coming sale.')}save();render()};

// Make catalogue count honest.
const oldCat=window.catalogue;window.catalogue=function(){const n=Math.min(500,cars.length);return oldCat().replace('500 Classic Car Types',n+' Classic Car Types').replace('cars.slice(0,500)', 'cars.slice(0,500)')};

// Simple diagnostics exposed in the Ledger so gameplay bugs can be checked without opening dev tools.
window.northshireDiagnostics=function(){return {catalogueTypes:Math.min(500,cars.length),yardLots:(state.nextAuctionLots||[]).length,auctionActive:!!state.auction,flagged:(state.flags||[]).length,restored:(state.inventory||[]).filter(c=>c.restored).length,reserveLots:(state.nextAuctionLots||[]).filter(c=>c.reserve).length}};

render();
})();
</script>
<script>
/* Northshire V7 repair */
(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>money(n);
state.flags=Array.isArray(state.flags)?state.flags:[];
state.notifications=Array.isArray(state.notifications)?state.notifications:[];
state.conditionReports=state.conditionReports||{};
state.nextAuctionLots=Array.isArray(state.nextAuctionLots)?state.nextAuctionLots:[];
state.unsold=Array.isArray(state.unsold)?state.unsold:[];
state.consigned=Array.isArray(state.consigned)?state.consigned:[];

/* Correct requested models. Existing verified photos are retained; all other
   models use an exact-match Wikimedia Commons lookup and NEVER a wrong model photo. */
const exact={
 'Reliant|Scimitar GTE SE5A':'https://commons.wikimedia.org/wiki/Special:FilePath/Reliant%20Scimitar%20GTE%20%28SE5A%29%20side.jpg',
 'Austin|Allegro 1300':'https://commons.wikimedia.org/wiki/Special:FilePath/Austin%20Allegro%201300%20in%20red.jpg',
 'Audi|100 C2':'https://commons.wikimedia.org/wiki/Special:FilePath/Audi%20100%20C2%20%281%29.jpg',
 'Audi|100 C3':'https://commons.wikimedia.org/wiki/Special:FilePath/Audi%20100%20C3.jpg',
 'Bedford|CA Dormobile':'https://commons.wikimedia.org/wiki/Special:FilePath/Bedford%20CA%20Dormobile.jpg',
 'Bedford|CF 250 Camper':'https://commons.wikimedia.org/wiki/Special:FilePath/Bedford%20CF%20Dormobile.jpg'
};
const imgCache={};
try{Object.assign(imgCache,JSON.parse(localStorage.getItem('northshireImages')||'{}'))}catch(e){}
function ph(c){return '<div class="placeholder" data-imgkey="'+esc(c.make+'|'+c.model)+'">'+(c.style==='Commercial classic'?'🚚':'🚗')+'<small style="display:block;font-size:12px;margin-left:8px">'+esc(c.make+' '+c.model)+'</small></div>'}
function photoHTML(c){const k=c.make+'|'+c.model, u=exact[k]||imgCache[k]; if(u)return '<img class="carimg" src="'+esc(u)+'" alt="'+esc(c.year+' '+c.make+' '+c.model)+'" loading="lazy">'; const key=(typeof modelPhoto!=='undefined'?modelPhoto[k]:null); if(key&&typeof PHOTO_FALLBACK!=='undefined'&&PHOTO_FALLBACK[key])return '<img class="carimg" src="'+esc(PHOTO_FALLBACK[key])+'" alt="'+esc(c.year+' '+c.make+' '+c.model)+'" loading="lazy">'; return ph(c)}
window.image=photoHTML;

async function findCommons(c){
 const k=c.make+'|'+c.model;if(exact[k]||imgCache[k])return;
 try{
  const q=encodeURIComponent('"'+c.make+' '+c.model+'"');
  const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&format=json&origin=*';
  const r=await fetch(u);const j=await r.json();const pages=Object.values(j.query?.pages||{});
  const terms=(c.make+' '+c.model).toLowerCase().split(/\s+/).filter(x=>x.length>2);
  const hit=pages.find(p=>{const t=(p.title||'').toLowerCase();return terms.filter(x=>t.includes(x)).length>=Math.max(2,Math.ceil(terms.length*.65))});
  if(hit?.imageinfo?.[0]?.url){imgCache[k]=hit.imageinfo[0].url;try{localStorage.setItem('northshireImages',JSON.stringify(imgCache))}catch(e){};refreshImageKey(k)}
 }catch(e){}
}
function refreshImageKey(k){document.querySelectorAll('[data-imgkey="'+CSS.escape(k)+'"]').forEach(n=>{const c={make:k.split('|')[0],model:k.split('|').slice(1).join('|'),style:''};n.outerHTML='<img class="carimg" src="'+esc(imgCache[k])+'" alt="'+esc(k.replace('|',' '))+'" loading="lazy">'})}
window.resolveCatalogueImages=function(){cars.slice(0,500).forEach((c,i)=>setTimeout(()=>findCommons(c),i*20))};

/* Exact weekly yard. Preserve returned/consigned instances and vary only fresh examples. */
function cloneLot(c,keepCondition){const x={...c};x.instanceId=(c.id||0)+'-'+state.week+'-'+Math.random().toString(36).slice(2,7);if(!keepCondition)x.condition=rand(20,96);x.reserve=x.reserve||Math.round((c.guide[0]*(.62+rand(0,20)/100))/250)*250;x.flagged=state.flags.includes(c.id);return x}
function prepareYardV7(){
 const carry=[...state.unsold,...state.consigned].map(x=>typeof x==='object'?x:null).filter(Boolean).map(x=>{const y={...x};y.flagged=state.flags.includes(y.id);return y});
 const carriedIds=new Set(carry.map(x=>x.id));
 const fresh=cars.slice(0,500).filter(c=>!carriedIds.has(c.id)).sort(()=>Math.random()-.5).slice(0,Math.max(0,12-carry.length)).map(c=>cloneLot(c,false));
 state.nextAuctionLots=[...carry,...fresh].slice(0,12);state.unsold=[];state.consigned=[];save();render();
}
window.v4GenerateNextLots=prepareYardV7;
if(!state.nextAuctionLots.length)prepareYardV7();

/* Condition reports: only exact next-auction lots may be inspected. */
function reportHTML(c){const r=state.conditionReports[c.instanceId||c.id]||{};return '<div class="notice" style="margin-top:10px;text-align:left"><b>Condition report</b><p>Visual inspection: '+(r.basic?'complete':'not purchased')+'</p><p>Mechanical inspection: '+(r.full?'complete':'not purchased')+'</p>'+(r.basic?'<p>Body/interior: '+(c.condition<40?'very rough':c.condition<65?'used and imperfect':'presentable')+'</p>':'')+(r.full?'<p>Mechanical: '+(c.condition<40?'major recommissioning likely':c.condition<70?'mechanical work likely':'generally sound')+'</p><p>Restoration risk: '+(c.condition<45?'HIGH':c.condition<70?'MEDIUM':'LOW')+'</p>':'')+'<button onclick="inspect('+JSON.stringify(c.instanceId||c.id)+',false)">Basic report £200</button><button onclick="inspect('+JSON.stringify(c.instanceId||c.id)+',true)">Full report £750</button></div>'}
window.inspect=function(id,full){
 const lot=(state.nextAuctionLots||[]).find(c=>(c.instanceId||c.id)==id);
 if(!lot){alert('Condition reports are only available for cars in the Viewing Yard / current auction.');return;}
 const key=lot.instanceId||lot.id,r=state.conditionReports[key]||{};const cost=full?750:200,prop=full?'full':'basic';
 if(r[prop])return alert(full?'The full report is already available.':'The basic report is already available.');
 if(state.cash<cost)return alert('You need '+money(cost)+' for this report.');state.cash-=cost;r[prop]=true;state.conditionReports[key]=r;save();render();
}

/* Catalogue is reference-only: no reports and no inspect buttons. */
function catalogueV7(){return '<div class="notice"><h2>Full Catalogue — 500 Car Types</h2><p>This is a model reference. <b>Condition reports are not available from the catalogue.</b> Open the Viewing Yard to inspect the exact example being auctioned.</p></div><div class="grid">'+cars.slice(0,500).map(c=>'<div class="card">'+photoHTML(c)+'<div class="cardbody"><h3>'+esc(c.year+' '+c.make+' '+c.model)+'</h3><span class="tag">'+esc(c.style)+'</span><p>Guide: '+money(c.guide[0])+'–'+money(c.guide[1])+'</p><p class="muted">Condition varies by individual auction example.</p></div></div>').join('')+'</div>'}
window.catalogue=catalogueV7;

function yardCard(c){const flag=state.flags.includes(c.id),rest=c.restored||c.restoredSource;return '<div class="card '+(flag?'flagged':'')+'">'+photoHTML(c)+'<div class="cardbody"><h3>'+esc(c.year+' '+c.make+' '+c.model)+'</h3><span class="tag">'+esc(c.style)+'</span>'+(c.project?'<span class="tag">FULL PROJECT</span>':'')+(rest?'<span class="tag positive">RESTORED</span>':'')+(flag?'<span class="tag">★ FLAGGED</span>':'')+'<p>Condition: <b>'+c.condition+'/100</b></p><p>Guide: '+money(c.guide[0])+'–'+money(c.guide[1])+' • Reserve: '+money(c.reserve)+'</p>'+reportHTML(c)+'<button class="secondary" onclick="flagCar('+c.id+')">'+(flag?'Unflag':'★ Flag to bid')+'</button></div></div>'}
function homeV7(){const days=7-(state.day%7)||7;return '<div class="notice"><h2>Week '+state.week+' • Day '+state.day+'</h2><p>The Viewing Yard is the authoritative list for the next auction.</p>'+(state.day%7===0?'<button onclick="weeklyAuction()">Enter weekly auction</button>':'<button onclick="advanceDay()">Advance one day</button>')+' <button class="secondary" onclick="state.screen=\'catalogue\';render()">Full catalogue</button><p class="week">Next auction: '+days+' day'+(days===1?'':'s')+'.</p></div><h2>Viewing Yard — Next Auction</h2><div class="grid">'+(state.nextAuctionLots.length?state.nextAuctionLots.map(yardCard).join(''):'<p class="muted">No lots prepared.</p>')+'</div>'}
window.home=homeV7;

/* Robust auction engine. */
const bidders=[
['Colin Mercer','Floor','collector','slow'],['Sarah Whitfield','Floor','enthusiast','medium'],['Dave Pritchard','Floor','dealer','fast'],['Helen Barker','Floor','collector','slow'],['Graham Holt','Floor','dealer','slow'],['Tom Fletcher','Floor','enthusiast','fast'],['Peter Lawson','Floor','restorer','slow'],['Janet Cole','Floor','collector','slow'],['Martin Shaw','Floor','dealer','medium'],['Nicola Grant','Floor','collector','slow'],['Richard Bell','Floor','enthusiast','medium'],['Caroline West','Floor','collector','slow'],['Richard — Telephone','Telephone','collector','slow'],['Emma — North East','Telephone','enthusiast','medium'],['Jonathan — Surrey','Telephone','collector','slow'],['Charlotte — Kent','Telephone','collector','medium'],['Internet Bidder 184','Internet','dealer','fast'],['Internet Bidder 327','Internet','collector','medium'],['Internet Bidder 512','Internet','enthusiast','slow'],['Internet Bidder 901','Internet','restorer','slow'],['Internet Bidder 114','Internet','dealer','fast'],['Internet Bidder 640','Internet','collector','slow']
];
const remarks={collector:['That is exactly the sort of car I collect.','I have been looking for the right one.','Very interesting specification.'],dealer:['There may be a little margin in that.','That is getting close to my number.','I would buy it at the right money.'],enthusiast:['I love these.','That is the one I came for.','Lovely thing.'],restorer:['I can see the potential.','That needs money, but it could work.','The shell is worth saving.']};
function inc(v){if(v<3000)return 100;if(v<7500)return 250;if(v<15000)return 250;if(v<30000)return 500;if(v<60000)return 1000;return 2500}
function makeAI(c){return bidders.slice().sort(()=>Math.random()-.5).slice(0,rand(5,9)).map((p,i)=>{let max=c.guide[0]+(c.guide[1]-c.guide[0])*(.12+rand(0,45)/100);if(p[2]==='dealer')max*=.88;if(p[2]==='collector')max*=1+(c.pop-70)/450;if(p[2]==='restorer'&&c.condition<45)max*=1.05;if(p[3]==='slow')max*=.96;if(p[3]==='fast')max*=1.01;return {name:p[0],channel:p[1],type:p[2],speed:p[3],max:Math.max(c.guide[0]*.62,Math.round(max/250)*250),active:true,id:i}})}
function audio(f,d){try{window.__nsac=window.__nsac||new (AudioContext||webkitAudioContext)();const o=window.__nsac.createOscillator(),g=window.__nsac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.035;o.connect(g);g.connect(window.__nsac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,window.__nsac.currentTime+d);o.stop(window.__nsac.currentTime+d)}catch(e){}}
function cheer(){[600,760,920,1160].forEach((f,i)=>setTimeout(()=>audio(f,.1),i*90))}
function hammer(){audio(150,.12);setTimeout(()=>audio(105,.08),120)}
function clearTimers(){const a=state.auction;if(!a)return;clearTimeout(a.waitTimer);clearTimeout(a.aiTimer);clearInterval(a.goingTimer)}
window.weeklyAuction=function(){
 if(state.auction)return;if(state.day%7!==0)return alert('Auctions are held once a week on Day 7.');if(state.lastAuctionWeek===state.week)return alert('This week’s auction is already complete.');if(!state.nextAuctionLots.length)prepareYardV7();
 state.lastAuctionWeek=state.week;state.auction={queue:state.nextAuctionLots.map(x=>({...x})),index:0,phase:'wait',wait:4,current:null,bidders:[],highest:0,highestBidder:null,bidLog:[],going:12};state.screen='auction';save();render();nextLot()}
window.startAuction=window.weeklyAuction;
function nextLot(){const a=state.auction;if(!a)return;clearTimers();a.phase='wait';a.wait=4;render();a.waitTimer=setTimeout(showLot,4000);}
function showLot(){const a=state.auction;if(!a||!a.queue[a.index])return endAuction();a.current=a.queue[a.index];a.phase='bidding';a.opening=Math.max(250,Math.round(a.current.guide[0]*.65/100)*100);a.highest=0;a.highestBidder=null;a.bidders=makeAI(a.current);a.bidLog=['Auctioneer: “Lot '+(a.index+1)+'. '+a.current.year+' '+a.current.make+' '+a.current.model+'. Who will start me?”'];render();a.aiTimer=setTimeout(ai,1100)}
function ai(){const a=state.auction;if(!a||a.phase!=='bidding')return;const target=a.highest?a.highest+inc(a.highest):a.opening;const ok=a.bidders.filter(b=>b.active&&b.max>=target);if(!ok.length)return beginGoing();const b=ok[rand(0,ok.length-1)];a.highest=target;a.highestBidder=b.name;a.bidLog.unshift((b.channel==='Telephone'?'☎ Telephone bidder':b.channel==='Internet'?'⌨ Internet bidder':b.name)+' bids '+money(target)+'.');a.bidLog.unshift((b.channel==='Floor'?b.name:b.channel)+' — “'+remarks[b.type][rand(0,remarks[b.type].length-1)]+'”');audio(480,.045);render();const d=b.speed==='slow'?2200+Math.random()*2600:b.speed==='medium'?1100+Math.random()*1500:450+Math.random()*750;a.aiTimer=setTimeout(ai,d)}
window.playerBid=function(){const a=state.auction;if(!a||a.phase!=='bidding'||a.playerDropped)return;const offer=a.highest?a.highest+inc(a.highest):a.opening;if(offer>state.cash)return alert('That bid exceeds your cash.');a.highest=offer;a.highestBidder='YOU';a.bidLog.unshift('You bid '+money(offer)+'.');audio(760,.07);render();a.aiTimer=setTimeout(ai,550)};
window.drop=function(){if(state.auction){state.auction.playerDropped=true;state.auction.bidLog.unshift('You are out.');render()}};
function beginGoing(){const a=state.auction;if(!a||a.phase!=='bidding')return;clearTimeout(a.aiTimer);a.phase='going';a.going=12;render();a.goingTimer=setInterval(()=>{if(!state.auction)return;state.auction.going--;const n=state.auction.going;if(n===9)a.bidLog.unshift('Auctioneer: “Going once...”');if(n===6)a.bidLog.unshift('Auctioneer: “Going twice...”');if(n===3)a.bidLog.unshift('Auctioneer: “Last chance!”');render();if(n<=0){clearInterval(a.goingTimer);hammer();settle()}},500)}
function settle(){const a=state.auction,c=a.current,r=c.reserve||Math.round(c.guide[0]*.72/250)*250,sold=a.highest>=r,won=sold&&a.highestBidder==='YOU';a.phase='result';if(won){state.cash-=a.highest;state.inventory.push({...c,purchase:a.highest,auctionWeek:state.week});state.notifications.unshift('PURCHASE: '+c.year+' '+c.make+' '+c.model+' bought for '+money(a.highest)+'.');cheer()}else if(!sold){state.unsold.push({...c,condition:c.condition,reserve:r})}a.result={sold,won,price:a.highest,reserve:r,buyer:a.highestBidder||'No sale'};render();setTimeout(()=>{if(!state.auction)return;a.index++;state.lotNumber=(state.lotNumber||1)+1;if(a.index>=a.queue.length)endAuction();else nextLot()},2500)}
function endAuction(){clearTimers();state.auction=null;state.screen='home';state.notifications.unshift('Weekly auction finished. Unsold lots will return to the next Viewing Yard.');save();render()}
window.leaveAuctionRoom=function(){if(!state.auction)return;if(!confirm('Leave the auction room? The sale will be abandoned and this week’s auction will be cancelled.'))return;clearTimers();state.auction=null;state.screen='home';save();render()}
window.showNextListings=function(){const a=state.auction;if(!a)return;const n=a.queue.slice(a.index+1,a.index+7);const d=document.createElement('div');d.style='position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9999';d.innerHTML='<div style="background:#202020;color:#fff;max-width:720px;width:92%;padding:22px;border-radius:10px"><h2>Next listings</h2>'+(n.length?n.map((c,i)=>'<p><b>Lot '+(a.index+i+2)+' — '+esc(c.year+' '+c.make+' '+c.model)+'</b><br>Guide '+money(c.guide[0])+'–'+money(c.guide[1])+' • Reserve '+money(c.reserve)+(state.flags.includes(c.id)?' • ★ FLAGGED':'')+'</p>').join(''):'<p>No more listings.</p>')+'<button onclick="this.parentNode.parentNode.remove()">Close</button></div>';document.body.appendChild(d)};

function auctionV7(){const a=state.auction;if(!a)return '<div class="notice"><h2>Auction House</h2><p>There is no auction running. Weekly sales are held on Day 7.</p></div>';if(a.phase==='wait')return '<div class="auctionstage"><div class="lotno">NEXT LOT</div><h2>The auctioneer is bringing the next car into the room...</h2><div class="bid">'+a.wait+'</div><p>Lot '+(a.index+1)+' of '+a.queue.length+'</p><button class="secondary" onclick="showNextListings()">See next listings</button><button class="danger" onclick="leaveAuctionRoom()">Leave auction room</button></div>';if(a.phase==='result')return '<div class="auctionstage">'+photoHTML(a.current)+'<h2>'+(a.result.won?'SOLD TO YOU':a.result.sold?'LOT SOLD':'NO SALE — RESERVE NOT MET')+'</h2><div class="bid">'+(a.result.price?money(a.result.price):'—')+'</div><p>Reserve: '+money(a.result.reserve)+'</p><button class="secondary" onclick="showNextListings()">See next listings</button></div>';const c=a.current,p=a.phase==='going'?Math.max(0,a.going/12*100):100,call=a.phase==='going'?(a.going>6?'Going once...':a.going>3?'Going twice...':'LAST CHANCE!'):'Who will start me?';return '<div class="auctionstage">'+photoHTML(c)+'<div class="lotno">LOT '+(a.index+1)+'</div><h2>'+esc(c.year+' '+c.make+' '+c.model)+'</h2><p>Guide '+money(c.guide[0])+'–'+money(c.guide[1])+' • Reserve '+money(c.reserve)+'</p><div class="auctioneer">Auctioneer: “'+call+'”</div><div class="bid">'+(a.highest?money(a.highest):money(a.opening)+' opening')+'</div>'+(a.phase==='going'?'<div style="max-width:760px;margin:10px auto"><div class="progress"><i style="width:'+p+'%"></i></div></div>':'')+'<div class="bidlog">'+a.bidLog.slice(0,12).map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>'+(a.phase==='bidding'?'<button '+(a.playerDropped?'disabled':'')+' onclick="playerBid()">Bid '+money(a.highest?a.highest+inc(a.highest):a.opening)+'</button><button class="secondary" onclick="drop()">I am out</button>':'')+'<button class="secondary" onclick="showNextListings()">See next listings</button><button class="danger" onclick="leaveAuctionRoom()">Leave auction room</button></div>'}
window.auction=auctionV7;

/* Navigation/render. */
window.render=function(){const cash=document.getElementById('cash');if(cash)cash.textContent=money(state.cash);if(typeof nav==='function')nav();const app=document.getElementById('app');if(!app)return;app.innerHTML=state.screen==='home'?homeV7():state.screen==='catalogue'?catalogueV7():state.screen==='auction'?auctionV7():state.screen==='sell'?sellView():state.screen==='garage'?garage():ledger();save()};

/* Remove report buttons from the catalogue even if an older renderer is called. */
window.card=function(c){return '<div class="card">'+photoHTML(c)+'<div class="cardbody"><h3>'+esc(c.year+' '+c.make+' '+c.model)+'</h3><span class="tag">'+esc(c.style)+'</span><p>Guide: '+money(c.guide[0])+'–'+money(c.guide[1])+'</p><p class="muted">Model reference only — inspect the auction example in the Viewing Yard.</p></div></div>'};

/* Diagnostics. */
window.northshireDiagnostics=function(){return {catalogueTypes:Math.min(500,cars.length),yardLots:state.nextAuctionLots.length,auctionRunning:!!state.auction,conditionReports: Object.keys(state.conditionReports).length,flagged:state.flags.length,unsold:state.unsold.length,imagesCached:Object.keys(imgCache).length}};

save();render();
window.resolveCatalogueImages();
})();

</script>
</body></html>
